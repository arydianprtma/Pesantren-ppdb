[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=docker-php-entrypoint php-fpm
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

[program:queue-main]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pesantren-ppdb/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/pesantren-ppdb
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-main.log
stopasgroup=true
killasgroup=true
priority=20

[program:queue-ppdb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pesantren-ppdb/PPDB/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/pesantren-ppdb/PPDB
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-ppdb.log
stopasgroup=true
killasgroup=true
priority=20

[program:reverb-main]
command=php /var/www/pesantren-ppdb/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/pesantren-ppdb
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/reverb-main.log
stopasgroup=true
killasgroup=true
priority=30

[program:reverb-ppdb]
command=php /var/www/pesantren-ppdb/PPDB/artisan reverb:start --host=0.0.0.0 --port=8081
directory=/var/www/pesantren-ppdb/PPDB
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/reverb-ppdb.log
stopasgroup=true
killasgroup=true
priority=30
