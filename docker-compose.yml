services:
  # ─────────────────────────────────────────────
  # Database Service (MariaDB 10.11 LTS - Hemat RAM & Kompatibel Penuh)
  # ─────────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: ppdb_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE: ${DB_DATABASE:-riyadussalikin_db}
      MYSQL_USER: ${DB_USERNAME:-arydianprtma}
      MYSQL_PASSWORD: ${DB_PASSWORD:-REXUSlit-535}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ppdb_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Application Service (PHP 8.4-FPM + Supervisor + Reverb + Queues)
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppdb_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-riyadussalikin_db}
      DB_USERNAME: ${DB_USERNAME:-arydianprtma}
      DB_PASSWORD: ${DB_PASSWORD:-REXUSlit-535}
    volumes:
      - .:/var/www/pesantren-ppdb
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - ppdb_network

  # ─────────────────────────────────────────────
  # Web Server (Nginx + Cloudflare SSL + WebSocket Proxy)
  # ─────────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: ppdb_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/pesantren-ppdb:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - app
    networks:
      - ppdb_network

volumes:
  db_data:
    driver: local

networks:
  ppdb_network:
    driver: bridge
